[versions]
junit-jupiter = "6.1.3"
mockk = "1.14.11"
kotlin-logging = "8.0.4"
logback = "1.6.6"
logstash = "9.0"
ktor = "3.6.0"
kafka = "8.4.0-ccs"
avro = "1.12.2"
confluent = "8.4.0"
prometheus = "1.17.2"
kotlinx-serialization = "1.12.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash"}
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor"}
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
confluent-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent"}
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.21" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.21" }
