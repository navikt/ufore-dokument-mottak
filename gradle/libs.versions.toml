[versions]
junit-jupiter = "6.1.3"
mockk = "1.14.11"
kotlin-logging = "8.0.4"
logback = "1.6.5"
logstash = "9.0"
ktor = "3.6.0"
kafka = "4.4.0"
avro = "1.12.2"
confluent = "8.4.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash"}
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
confluent-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent"}

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.21" }
