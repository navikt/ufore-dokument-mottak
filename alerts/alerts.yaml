apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    team: ufore
  name: ufore-dokument-mottak-alerts
  namespace: ufore
spec:
  groups:
    - name: ufore-dokument-mottak-alerts
      rules:
        - alert: "For mange serverfeil"
          expr: |
            round(
                sum(rate(http_server_requests_seconds_count{app=~"ufore-dokument-mottak", status=~"[5].."}[5m])) by (app, uri) / sum(rate(http_server_requests_seconds_count{app=~"ufore-dokument-mottak"}[5m])) by (app, uri) * 100 
            ) > 10
          for: 2m
          annotations:
            message: "*{{ $labels.app }}*: {{ $value }}% 5xx-feil fra `{{ $labels.uri }}` siste 2 min!"
          labels:
            severity: error
            namespace: ufore
            ufore_alerts: slack
            alert_type: custom
        - alert: "Container i CrashLoopBackOff"
          expr: |
            max by (container) (
              max_over_time(
                kube_pod_container_status_waiting_reason{
                  namespace="ufore",
                  k8s_cluster_name="prod",
                  reason="CrashLoopBackOff",
                  container="ufore-dokument-mottak"
                }[5m]
              )
            ) > 0
          annotations:
            message: "*{{ $labels.container }}* har vært i CrashLoopBackOff de siste 5 minuttene."
          labels:
            severity: error
            namespace: ufore
            ufore_alerts: slack
            alert_type: custom
