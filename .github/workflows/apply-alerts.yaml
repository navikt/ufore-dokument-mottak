name: Apply alerts

on:
  push:
    branches:
      - main
    paths:
      - 'apply-alerts.yaml'
      - 'alerts/**'

jobs:
  apply-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7
        env:
          CLUSTER: prod-gcp
          RESOURCE: alerts/alert-manager-config.yaml,alerts/alerts.yaml
