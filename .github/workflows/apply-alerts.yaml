name: Apply alerts

on:
  push:
    branches:
      - main
    paths:
      - 'apply-alerts.yaml'
      - 'alerts/**'

jobs:
  apply-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/deploy/actions/deploy@b1a9a40dae937091497f8f29c5ea5334cc1c0643
        env:
          CLUSTER: prod-gcp
          RESOURCE: alerts/alert-manager-config.yaml,alerts/alerts.yaml
