spec:
  #ingresses:
  #  - https://ufore-dokument-mottak.intern.nav.no
  replicas:
    min: 2
    max: 4
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  kafka:
    pool: nav-prod
  env:
    - name: SAF_URL
      value: "https://saf.prod-fss-pub.nais.io/graphql"
    - name: SAF_SCOPE
      value: "api://prod-fss.teamdokumenthandtering.saf/.default"
  accessPolicy:
    outbound:
      external:
        - host: saf.prod-fss-pub.nais.io
