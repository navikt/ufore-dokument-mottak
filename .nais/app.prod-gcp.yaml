spec:
  #ingresses:
  #  - https://ufore-dokument-mottak.intern.nav.no
  replicas:
    min: 2
    max: 4
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  kafka:
    pool: nav-prod
  env:
    - name: SAF_URL
      value: "https://saf.prod-fss-pub.nais.io"
    - name: SAF_SCOPE
      value: "api://prod-fss.teamdokumenthandtering.saf/.default"
    - name: OPPGAVE_URL
      value: "https://oppgave.prod-fss-pub.nais.io"
    - name: OPPGAVE_SCOPE
      value: "api://prod-fss.oppgavehandtering.oppgave/.default"
    - name: KODEVERK_URL
      value: "https://kodeverk-api.nav.no"
    - name: KODEVERK_SCOPE
      value: "api://dev-gcp.team-rocket.kodeverk-api/.default"
  accessPolicy:
    outbound:
      external:
        - host: saf.prod-fss-pub.nais.io
        - host: oppgave.prod-fss-pub.nais.io
        - host: kodeverk-api.nav.no
