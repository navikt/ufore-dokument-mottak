spec:
  #ingresses:
  #  - https://ufore-dokument-mottak.intern.dev.nav.no
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  kafka:
    pool: nav-dev
  env:
    - name: SAF_URL
      value: "https://saf-q2.dev-fss-pub.nais.io"
    - name: SAF_SCOPE
      value: "api://dev-fss.teamdokumenthandtering.saf/.default"
    - name: OPPGAVE_URL
      value: "https://oppgave.dev-fss-pub.nais.io"
    - name: OPPGAVE_SCOPE
      value: "api://dev-fss.oppgavehandtering.oppgave/.default"
    - name: KODEVERK_URL
      value: "https://kodeverk-api.nav.no"
    - name: KODEVERK_SCOPE
      value: "api://dev-gcp.team-rocket.kodeverk-api/.default"
  accessPolicy:
    outbound:
      external:
        - host: saf-q2.dev-fss-pub.nais.io
        - host: oppgave.dev-fss-pub.nais.io
        - host: kodeverk-api.nav.no
